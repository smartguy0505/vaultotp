<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'" />
  <title>Select QR region</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      cursor: crosshair;
      background: #000;
      font-family: "Segoe UI", sans-serif;
      user-select: none;
    }
    #shot {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      pointer-events: none;
    }
    #dim {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      pointer-events: none;
    }
    #box {
      position: absolute;
      border: 2px solid #ffffff;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.45);
      background: transparent;
      display: none;
      pointer-events: none;
    }
    #hint {
      position: fixed;
      left: 50%;
      top: 24px;
      transform: translateX(-50%);
      z-index: 5;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(23, 23, 23, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #f5f5f5;
      font-size: 14px;
      pointer-events: none;
      white-space: nowrap;
    }
    #hint kbd {
      display: inline-block;
      padding: 1px 6px;
      margin: 0 2px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.08);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <img id="shot" alt="" />
  <div id="dim"></div>
  <div id="box"></div>
  <div id="hint">Drag a box around the QR code · release to scan · <kbd>Esc</kbd> cancel</div>
  <script src="region-select.js"></script>
</body>
</html>
